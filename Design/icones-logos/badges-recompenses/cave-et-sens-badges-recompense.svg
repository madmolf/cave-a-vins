      <ellipse cx="-52" cy="82" rx="4" ry="7" transform="rotate(-10 -52 82)"/>
      <ellipse cx="-49" cy="97" rx="4" ry="7" transform="rotate(15 -49 97)"/>
      <ellipse cx="50" cy="68" rx="4" ry="7" transform="rotate(30 50 68)"/>
      <ellipse cx="52" cy="82" rx="4" ry="7" transform="rotate(10 52 82)"/>
