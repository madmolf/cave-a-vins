    <text x="0" y="131" text-anchor="middle" font-family="'Playfair Display', serif" font-size="41" font-weight="700" fill="#ffffff">10</text>
    <g stroke="#ffffff" stroke-opacity="0.55" fill="none" stroke-width="2.4">
