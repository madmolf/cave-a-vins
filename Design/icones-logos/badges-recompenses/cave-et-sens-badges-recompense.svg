  <!-- 6. Partage - Sommelier Social (émeraude) -->
  <g transform="translate(1210,0)">
    <circle cx="0" cy="95" r="74" fill="url(#emeraude)" stroke="#0f3a26" stroke-width="2"/>
    <circle cx="0" cy="95" r="63" fill="none" stroke="#ffffff" stroke-opacity="0.35" stroke-width="1.5"/>
