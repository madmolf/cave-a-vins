    <radialGradient id="inner" cx="35%" cy="30%" r="80%">
      <stop offset="0%" stop-color="#5c2033"/>
      <stop offset="100%" stop-color="#2b0e17"/>
    </radialGradient>

    <linearGradient id="bronze" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#e0a469"/><stop offset="100%" stop-color="#93502a"/>
    </linearGradient>
    <linearGradient id="argent" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#e9e3d6"/><stop offset="100%" stop-color="#a89a7d"/>
    </linearGradient>
    <linearGradient id="or" x1="0" y1="0" x2="1" y2="1">
